# Beta-posterior baseline with untuned defaults: Beta(1, 1) prior, unit evidence weight,
# no decay. ASSISTments 2009 has no clock, so a time-based half-life cannot apply.
dataset: assist2009
model: beta
runs: 5
params:
  prior: fixed
  prior_alpha: 1.0
  prior_beta: 1.0
  half_life: null
  decay_unit: steps
