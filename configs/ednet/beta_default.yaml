# Beta-posterior baseline with untuned defaults: Beta(1, 1) prior, unit evidence weight,
# evidence half-life of 23.1 days (decay rate 0.03 per day) on EdNet's real clock.
dataset: ednet
model: beta
runs: 5
params:
  prior: fixed
  prior_alpha: 1.0
  prior_beta: 1.0
  half_life: 23.1
  decay_unit: days
