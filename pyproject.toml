[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ktbench"
version = "0.1.0"
description = "A reproducible benchmark of knowledge-tracing models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Jahangir" }]
# Install torch first from the PyTorch index (CPU or CUDA build); see README.
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.0",
    "pyarrow==26.0.1",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "torch==2.14.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ktbench"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
